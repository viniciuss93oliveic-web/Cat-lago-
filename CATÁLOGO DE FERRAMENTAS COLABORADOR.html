<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Catálogo de Ferramentas • Colaborador</title>
<style>
:root{--bg:#070b12;--p:#101824;--p2:#151f2d;--t:#eef6ff;--m:#91a4b8;--a:#19c6ff;--b:#0077ff;--ok:#35d07f;--bd:#243447}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102338,#070b12 45%);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{padding:20px 16px 14px;position:sticky;top:0;background:#070b12ee;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:23px}
h1{font-size:20px;margin:0}.sub,.small,.meta{color:var(--m);font-size:12px}main{padding:16px;max-width:760px;margin:auto}.search{display:flex;gap:8px;margin:10px 0}
input{flex:1;background:var(--p);border:1px solid var(--bd);color:var(--t);border-radius:14px;padding:15px;font-size:16px;outline:0}button{border:0;border-radius:14px;padding:13px 15px;font-weight:750;color:#fff;background:linear-gradient(135deg,var(--b),#00aeea);cursor:pointer}
button.secondary,.file{background:var(--p2);border:1px solid var(--bd)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 16px}
.status{display:flex;justify-content:space-between;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:15px;font-size:13px}.dot{width:9px;height:9px;background:var(--ok);border-radius:50%;display:inline-block;margin-right:7px}
.card{background:linear-gradient(180deg,var(--p),#0c141f);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 10px 30px #0004}.code{font-size:21px;font-weight:850;color:var(--a);word-break:break-word}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff0c}.label{color:var(--m)}.value{font-weight:650;text-align:right;max-width:65%;word-break:break-word}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:var(--m);padding:34px 12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#070b12f5;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 6px 12px;z-index:6}nav button{background:0;color:var(--m);padding:7px 10px;font-size:11px}nav button.active{color:var(--a)}
.page{padding-bottom:80px}label.file{display:inline-block;padding:12px 14px;border-radius:14px;font-weight:700;cursor:pointer}
@media(min-width:650px){.actions{grid-template-columns:repeat(4,1fr)}}

.photo-box{margin:14px 0;border:1px solid var(--bd);border-radius:18px;overflow:hidden;background:#0a1018;min-height:190px;display:flex;align-items:center;justify-content:center}
.photo-box img{width:100%;max-height:360px;object-fit:contain;display:block}
.photo-empty{text-align:center;color:var(--m);padding:40px 20px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.form-grid{display:grid;gap:10px}.form-grid label{display:block;color:var(--m);font-size:12px;margin-bottom:5px}
.form-grid input{width:100%}.danger-zone{border-color:#7b2638;background:linear-gradient(180deg,#24121a,#120b10)}
.tool-photo-preview{width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#080d14;margin-top:10px}
.manage-list .card{position:relative}.delete-btn{background:#7b2638!important}.edit-btn{background:var(--p2)!important;border:1px solid var(--bd)}

.tool-media-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.media-card{background:#0a1018;border:1px solid var(--bd);border-radius:18px;padding:12px;min-width:0}
.media-title{font-weight:800;margin-bottom:10px}
.photo-carousel{position:relative;min-height:250px;border-radius:14px;overflow:hidden;background:#05080d;display:flex;align-items:center;justify-content:center}
.photo-carousel img{width:100%;height:280px;object-fit:contain;display:block}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;font-size:30px;line-height:30px;cursor:pointer}
.carousel-btn.prev{left:10px}.carousel-btn.next{right:10px}
.carousel-dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.carousel-dot{width:7px;height:7px;border-radius:50%;background:#777}.carousel-dot.active{background:#fff}
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
@media(max-width:760px){.tool-media-grid,.photo-pair{grid-template-columns:1fr}.photo-carousel{min-height:220px}.photo-carousel img{height:250px}}



#cropPolygon{position:absolute;inset:0;pointer-events:none}
.crop-handle{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #fff;border-radius:50%;background:#111;box-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:auto;touch-action:none;cursor:grab}
.crop-stage img{transition:filter .12s,transform .08s;position:absolute;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab;left:50%;top:50%}
.crop-stage img.dragging{cursor:grabbing}
.crop-frame{position:absolute;inset:8%;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.48);pointer-events:none;border-radius:10px}
.transform-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#cropBox{position:absolute;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;touch-action:none}
.crop-stage{position:relative}
.crop-help{font-size:12px;color:#9ba7b5;margin:8px 0}
.editor-controls,.beautify-box{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.beautify-box{display:block;border:1px solid var(--bd);border-radius:14px;padding:12px}
.beautify-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.beautify-grid label{display:grid;gap:4px;font-size:12px}
@media(max-width:650px){.beautify-grid{grid-template-columns:1fr}}

.zoom-row{display:grid;grid-template-columns:42px 1fr 42px auto;gap:8px;align-items:center;margin:12px 0}
.zoom-row button{height:38px;font-size:22px}
.zoom-row input{width:100%}
.crop-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:14px}
.crop-panel{width:min(720px,100%);max-height:95vh;overflow:auto;background:#0d141d;border:1px solid var(--bd);border-radius:20px;padding:16px}
.crop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.crop-stage{height:52vh;min-height:280px;background:#05080d;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:none}
.crop-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center}
.crop-controls{display:grid;gap:10px;margin:14px 0}
.crop-controls label{display:grid;gap:5px;font-size:13px}
.crop-controls input{width:100%}
.camera-preview{width:100%;border-radius:16px;background:#000;display:none;max-height:360px;object-fit:cover}
.edit-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:14px}
.edit-panel{width:min(680px,100%);max-height:94vh;overflow:auto;background:#0d141d;border:1px solid var(--bd);border-radius:20px;padding:18px}
.edit-panel h3{margin-top:0}.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.edit-note{font-size:12px;color:var(--m);margin-top:8px}

.signature{position:relative;left:auto;right:auto;bottom:auto;text-align:center;padding:10px 10px 14px;margin-top:18px;background:rgba(5,8,13,.96);border-top:1px solid var(--bd);color:#8d99a8;font-size:11px;z-index:1}
body{padding-bottom:38px}

/* COLABORADOR OFFLINE • SOMENTE CONSULTA */
.readonly-badge{display:inline-flex;align-items:center;gap:6px;margin:8px 0 14px;padding:6px 10px;border:1px solid rgba(77,220,180,.35);border-radius:999px;color:#8ff0cf;background:rgba(77,220,180,.08);font-size:12px;font-weight:700}
.photo-actions{justify-content:flex-start!important}
</style></head><body>

/* Armazenamento robusto de fotos: IndexedDB. Os dados das ferramentas continuam no localStorage. */
const PHOTO_DB_NAME='NeoCatalogoFotos';
const PHOTO_DB_VERSION=1;
let photoReady=null;
let photoCache={toolPhotos:{},piecePhotos:{}};
function openPhotoDB(){
  if(photoReady)return photoReady;
  photoReady=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('IndexedDB indisponível'));return}
    const req=indexedDB.open(PHOTO_DB_NAME,PHOTO_DB_VERSION);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'key'})};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Não foi possível abrir o armazenamento de fotos'));
  });
  return photoReady;
}
function idbPut(key,value){return openPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({key,value});tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar foto'))}))}
function idbDelete(key){return openPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('Falha ao apagar foto'))}))}
function idbGetAll(){return openPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error||new Error('Falha ao ler fotos'))}))}
async function loadPhotoCache(){
  try{
    const all=await idbGetAll(); photoCache={toolPhotos:{},piecePhotos:{}};
    all.forEach(x=>{const sep=String(x.key).indexOf(':');if(sep<0)return;const kind=String(x.key).slice(0,sep),id=String(x.key).slice(sep+1);if(kind==='toolPhotos'||kind==='piecePhotos')photoCache[kind][id]=x.value});
    return true;
  }catch(e){
    try{photoCache.toolPhotos=JSON.parse(localStorage.getItem('toolPhotos')||'{}');photoCache.piecePhotos=JSON.parse(localStorage.getItem('piecePhotos')||'{}');}catch(_){photoCache={toolPhotos:{},piecePhotos:{}}}
    return false;
  }
}
async function migrateLegacyPhotos(){
  try{
    await openPhotoDB();
    let moved=0;
    for(const key of ['toolPhotos','piecePhotos']){
      let legacy={};try{legacy=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){legacy={}}
      for(const [id,value] of Object.entries(legacy)){await idbPut(key+':'+id,value);moved++}
      if(Object.keys(legacy).length)localStorage.removeItem(key);
    }
    await loadPhotoCache();
    return moved;
  }catch(e){console.warn('Migração de fotos:',e);await loadPhotoCache();return 0}
}
async function initPhotoStorage(){await migrateLegacyPhotos()}
function getStoredPhoto(kind,id){return photoCache[kind]?.[id]||null}
async function savePhotoStore(key,id,value){
  try{
    photoCache[key]=photoCache[key]||{};photoCache[key][id]=value;
    await idbPut(key+':'+id,value);return true;
  }catch(err){
    console.error(err);alert('Não foi possível salvar a foto neste aparelho. Verifique o espaço disponível e tente novamente.');return false;
  }
}
async function removePhotoStore(key,id){
  try{if(photoCache[key])delete photoCache[key][id];await idbDelete(key+':'+id);return true}catch(err){console.error(err);return false}
}
async function getPhotoMapForBackup(){return {toolPhotos:{...photoCache.toolPhotos},piecePhotos:{...photoCache.piecePhotos}}}
async function importPhotoMap(key,map){if(!map||typeof map!=='object')return;for(const [id,value] of Object.entries(map))await savePhotoStore(key,id,value)}
function toggleFav(id){favorites=isFav({id})?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('toolFavs',JSON.stringify(favorites));renderCurrent()}

function getToolEditPhotos(id){let v=getStoredPhoto('toolPhotos',id);return Array.isArray(v)?v:(v?[v]:[])}
function initImageEditor(){
  let img=document.getElementById('manualCropImage'),stage=document.getElementById('manualCropStage'); if(!img||!stage)return;
  imageEditor.img=img;
  const init=()=>{imageEditor.x=0;imageEditor.y=0;imageEditor.zoom=1;fitEditorImage();previewEnhance();bindDrag();applyImageTransform()};
  if(img.complete)init();else img.onload=init;
}
function fitEditorImage(){
  let stage=document.getElementById('manualCropStage'),img=imageEditor.img;if(!stage||!img)return;
  let frame=stage.getBoundingClientRect(), pad=.84, targetW=frame.width*pad,targetH=frame.height*pad;
  let ratio=img.naturalWidth/img.naturalHeight;
  imageEditor.baseW=ratio>=1?targetW:targetH*ratio;
  imageEditor.baseH=ratio>=1?targetW/ratio:targetH;
  img.style.width=imageEditor.baseW+'px';img.style.height=imageEditor.baseH+'px';
}
function applyImageTransform(){
  let img=imageEditor.img;if(!img)return;
  img.style.transform=`translate(calc(-50% + ${imageEditor.x}px),calc(-50% + ${imageEditor.y}px)) scale(${imageEditor.zoom})`;
}
function setImageZoom(v){imageEditor.zoom=Number(v);let z=document.getElementById('imageZoom');if(z)z.value=imageEditor.zoom;let label=document.getElementById('zoomValue');if(label)label.textContent=Math.round(imageEditor.zoom*100)+'%';applyImageTransform()}
function changeImageZoom(delta){setImageZoom(Math.max(1,Math.min(3,imageEditor.zoom+delta)))}
function resetImageTransform(){imageEditor.zoom=1;imageEditor.x=0;imageEditor.y=0;setImageZoom(1);applyImageTransform()}
function bindDrag(){

function getFichaFields(t){
  const data=Array.isArray(t.dados)?t.dados.map(v=>String(v??'').trim()).filter(Boolean):[];
  const findAfter=(label)=>{
    const i=data.findIndex(v=>v.toUpperCase().replace(/\s+/g,'').startsWith(label));
    return i>=0 && data[i+1] && !/^(PESO:|END:|CÓDIGO:|NºOPERAÇÃO:)/i.test(data[i+1]) ? data[i+1] : '';
  };
  let peso=t.peso||findAfter('PESO:');
  let endereco=t.endereco||findAfter('END:');
  if(!peso){
    const i=data.findIndex(v=>/^PESO:?$/i.test(v));
    if(i>=0) peso=data[i+1]||'';
  }
  if(!endereco){
    const i=data.findIndex(v=>/^END:?$/i.test(v));
    if(i>=0) endereco=data[i+1]||'';
  }
  return {codigo:t.codigo||'',operacao:t.operacao||'',peso,endereco};
}

async function compressImageFile(file,maxDim=1200,quality=.72){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Falha ao ler a imagem'));
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('Imagem inválida'));
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

function exportToolsPDF(){

  const header='%PDF-1.4\n%âãÏÓ\n';let pdf=header,offsets=[0];

    const ov=getToolOverrides(); ov[id]={...(ov[id]||{}),codigo:code,operacao:op,peso:weight,endereco:address,dados,texto}; saveToolOverrides(ov);
  }
  closeEditTool(); openTool(id);
}

function previewNewPhoto(e){
let f=e.target.files[0];if(!f)return;
if(f.size>7*1024*1024){alert('Escolha uma foto de até 7 MB.');e.target.value='';return}
let r=new FileReader();r.onload=()=>{let img=document.getElementById('newPhotoPreview');img.src=r.result;img.style.display='block'};r.readAsDataURL(f)
}
function previewNewPiecePhoto(e){
let f=e.target.files[0];if(!f)return;
if(f.size>7*1024*1024){alert('A foto da peça deve ter até 7 MB.');e.target.value='';return}
let r=new FileReader();r.onload=()=>{let img=document.getElementById('newPiecePhotoPreview');img.src=r.result;img.style.display='block'};r.readAsDataURL(f)
}
async function registerTool(){
  let code=document.getElementById('newCode').value.trim(),op=document.getElementById('newOp').value.trim(),weight=document.getElementById('newWeight').value.trim(),desc=document.getElementById('newDesc').value.trim(),file=document.getElementById('newPhoto').files[0],pieceFile=document.getElementById('newPiecePhoto').files[0];
  if(!code){alert('Informe o código da ferramenta.');return}
  if(!op){alert('Informe a operação. Ex.: 1/1');return}
  let custom=getCustomTools();
  if(allTools().some(t=>String(t.codigo).toLowerCase()===code.toLowerCase() && String(t.operacao).toLowerCase()===op.toLowerCase())){alert('Já existe uma ferramenta com esse código e operação.');return}
  let id='custom-'+Date.now();
  custom.push({id,aba:'Cadastro local',linha:'-',codigo:code,operacao:op,peso:weight,dados:['CÓDIGO:',code,'Nº OPERAÇÃO:',op,'PESO:',weight,'DESCRIÇÃO:',desc],texto:[code,op,weight,desc].join(' | '),descricao:desc,custom:true});
  saveCustomTools(custom);
  try{
    if(file)await savePhotoStore('toolPhotos',id,await compressImageFile(file,1200,.72));
    if(pieceFile)await savePhotoStore('piecePhotos',id,[await compressImageFile(pieceFile,1200,.72)]);
    alert('Ferramenta cadastrada com sucesso!');manage();
  }catch(err){alert('Ferramenta cadastrada, mas não foi possível salvar uma das fotos. Tente adicioná-la pela ficha.');console.error(err);manage()}
}
function clearNewForm(){manage()}
async function deleteTool(id){
let t=allTools().find(x=>x.id===id);if(!t)return;
if(!confirm(`Excluir a ferramenta ${t.codigo} (${t.operacao})? Esta ação não pode ser desfeita neste aparelho.`))return;
if(t.custom){
let a=getCustomTools().filter(x=>x.id!==id);saveCustomTools(a)
}else{
let deleted=JSON.parse(localStorage.getItem('deletedTools')||'[]');if(!deleted.includes(id))deleted.push(id);localStorage.setItem('deletedTools',JSON.stringify(deleted))
}
await removePhotoStore('toolPhotos',id);await removePhotoStore('piecePhotos',id);
favorites=favorites.filter(x=>x!==id);localStorage.setItem('toolFavs',JSON.stringify(favorites));
manage()
}
function restoreTool(id){
let d=JSON.parse(localStorage.getItem('deletedTools')||'[]').filter(x=>x!==id);localStorage.setItem('deletedTools',JSON.stringify(d));manage()
}
function visibleTools(){let deleted=new Set(JSON.parse(localStorage.getItem('deletedTools')||'[]'));return allTools().filter(t=>!deleted.has(t.id))}
function renderManageList(){
let list=document.getElementById('manageList');if(!list)return;
let custom=getCustomTools(),deletedIds=new Set(JSON.parse(localStorage.getItem('deletedTools')||'[]'));
let visible=visibleTools();
list.innerHTML=`<h3>Ferramentas cadastradas (${visible.length})</h3>`+
visible.map(t=>`<div class="card"><div class="code">${esc(t.codigo)}</div><div class="meta">Operação ${esc(t.operacao)}${t.custom?' • Cadastro local':''}</div>${t.peso?`<div class="row"><span class="label">Peso</span><span class="value">${esc(t.peso)}</span></div>`:''}<div class="toolbar"><button class="edit-btn" onclick="openTool('${t.id}')">Ver ficha</button><button class="delete-btn" onclick="deleteTool('${t.id}')">🗑 Excluir</button></div></div>`).join('')+
`<div class="card danger-zone"><b>Itens excluídos da lista</b><div class="small" style="margin:7px 0">${deletedIds.size} ferramenta(s) ocultada(s) deste aparelho.</div>${[...deletedIds].map(id=>{let t=TOOLS.find(x=>x.id===id);return t?`<div class="row"><span>${esc(t.codigo)} • ${esc(t.operacao)}</span><button class="secondary" onclick="restoreTool('${id}')">Restaurar</button></div>`:''}).join('')}</div>`
}
